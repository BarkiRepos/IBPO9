<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
<title id="title">IBPO9: data routes</title><desc id="desc">Choose the company, dataset and output route.. Illustration only | Files use UTF-8 and pipe separators | DE = IVMK; MX = IVMP</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#167d8d"/></marker></defs>
<rect width="1100" height="740" rx="18" fill="#f2f6fb"/>
<text x="40" y="49" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#132b46">IBPO9: data routes</text>
<text x="40" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#465b73">Choose the company, dataset and output route.</text>
<rect x="40" y="105" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="145" r="20" fill="#167d8d"/>
<text x="76" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">1</text>
<text x="116" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Business Central company data</text>
<text x="116" y="156" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Materials, customers, suppliers, sales, purchasing and inventory</text>
<text x="116" y="176" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Production BOMs, routings, resources, units and quality</text>
<path d="M76 188 V208" stroke="#167d8d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="213" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="253" r="20" fill="#167d8d"/>
<text x="76" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">2</text>
<text x="116" y="240" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Manual route: UTT O9IBP Jobs</text>
<text x="116" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Select Demand planning / Supply planning options and review dates.</text>
<text x="116" y="284" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Result: a ZIP download containing the selected export files.</text>
<path d="M76 296 V316" stroke="#167d8d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="321" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="361" r="20" fill="#167d8d"/>
<text x="76" y="367" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">3</text>
<text x="116" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Snapshot route: O9 Snapshot Configurations</text>
<text x="116" y="372" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Save settings, choose Run Snapshot or Run All Active.</text>
<text x="116" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Result: server files plus buffer rows where supported by the exporter.</text>
<path d="M76 404 V424" stroke="#167d8d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="429" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="469" r="20" fill="#167d8d"/>
<text x="76" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">4</text>
<text x="116" y="456" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Scheduled route: Job Queue / Codeunit 67004</text>
<text x="116" y="480" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Runs all active snapshots first, then any parameter exports.</text>
<text x="116" y="500" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Result: files in the Manufacturing Setup export folder.</text>
<path d="M76 512 V532" stroke="#167d8d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="537" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="577" r="20" fill="#167d8d"/>
<text x="76" y="583" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">5</text>
<text x="116" y="564" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Validate and hand over to the O9 import process</text>
<text x="116" y="588" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Check headers, dates, currencies and sample business records.</text>
<text x="116" y="608" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">File creation and O9 import are separate operational steps.</text>
<text x="40" y="710" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Illustration only | Files use UTF-8 and pipe separators | DE = IVMK; MX = IVMP</text>
</svg>