<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
<title id="title">Snapshots: run, retain and inspect</title><desc id="desc">Configurations sharing an XMLport also share their buffer group.. Illustration only | Keeping buffer history does not archive server files</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#167d8d"/></marker></defs>
<rect width="1100" height="740" rx="18" fill="#f2f6fb"/>
<text x="40" y="49" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#132b46">Snapshots: run, retain and inspect</text>
<text x="40" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#465b73">Configurations sharing an XMLport also share their buffer group.</text>
<rect x="40" y="105" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="145" r="20" fill="#167d8d"/>
<text x="76" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">1</text>
<text x="116" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Create a configuration</text>
<text x="116" y="156" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Code + XML Port Name + Description + Dates + Keep History + Active</text>
<text x="116" y="176" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Active controls batch inclusion; Run Snapshot can run an inactive selected row.</text>
<path d="M76 188 V208" stroke="#167d8d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="213" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="253" r="20" fill="#167d8d"/>
<text x="76" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">2</text>
<text x="116" y="240" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Apply Keep History before export</text>
<text x="116" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">ON: retain existing matching buffer rows.</text>
<text x="116" y="284" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">OFF: delete buffer rows with the same XMLport batch name.</text>
<path d="M76 296 V316" stroke="#167d8d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="321" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="361" r="20" fill="#167d8d"/>
<text x="76" y="367" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">3</text>
<text x="116" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Run the exporter</text>
<text x="116" y="372" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Write the server file; add buffer rows where the exporter supports them.</text>
<text x="116" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">A repeated same-day filename can replace the existing file.</text>
<path d="M76 404 V424" stroke="#167d8d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="429" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="469" r="20" fill="#167d8d"/>
<text x="76" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">4</text>
<text x="116" y="456" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Choose Show Snapshot Data</text>
<text x="116" y="480" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Rows are filtered by XML Port Name, rather than configuration Code.</text>
<text x="116" y="500" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Use Export Date and the file header to interpret Field 1 through Field 49.</text>
<path d="M76 512 V532" stroke="#167d8d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="537" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="577" r="20" fill="#167d8d"/>
<text x="76" y="583" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">5</text>
<text x="116" y="564" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Cleanup Old Snapshots: full buffer reset</text>
<text x="116" y="588" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">After confirmation, the current implementation deletes ALL export buffer rows.</text>
<text x="116" y="608" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Keep History, Active and age do not limit this cleanup. Server files remain.</text>
<text x="40" y="710" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Illustration only | Keeping buffer history does not archive server files</text>
</svg>