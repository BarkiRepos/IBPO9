<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="title desc">
<title id="title">Purchase invoice data: read the values</title><desc id="desc">49 ordered columns from nonblank-type posted purchase invoice lines; credit memos excluded.. Illustration only | USD rates are required unless LCY is USD | Plant: DE = IVMK; MX = IVMP</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#167d8d"/></marker></defs>
<rect width="1100" height="740" rx="18" fill="#f2f6fb"/>
<text x="40" y="49" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#132b46">Purchase invoice data: read the values</text>
<text x="40" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#465b73">49 ordered columns from nonblank-type posted purchase invoice lines; credit memos excluded.</text>
<rect x="40" y="105" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="145" r="20" fill="#167d8d"/>
<text x="76" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">1</text>
<text x="116" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Select posted invoice lines by posting date</text>
<text x="116" y="156" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Distinct dates: use the entered range. Equal dates: reference date minus/plus three years.</text>
<text x="116" y="176" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Invoice Number is the internal posted document number.</text>
<path d="M76 188 V208" stroke="#167d8d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="213" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="253" r="20" fill="#167d8d"/>
<text x="76" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">2</text>
<text x="116" y="240" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Read invoice-currency prices</text>
<text x="116" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Unit Price = Direct Unit Cost</text>
<text x="116" y="284" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Net Price = Quantity x Direct Unit Cost, before discounts.</text>
<path d="M76 296 V316" stroke="#167d8d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="321" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="361" r="20" fill="#167d8d"/>
<text x="76" y="367" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">3</text>
<text x="116" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Read local and USD amounts</text>
<text x="116" y="372" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Local Amount = discounted line Amount excluding VAT, converted with the posted currency factor.</text>
<text x="116" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Amount = Local Amount converted to USD at the posting-date exchange rate.</text>
<path d="M76 404 V424" stroke="#167d8d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="429" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="469" r="20" fill="#167d8d"/>
<text x="76" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">4</text>
<text x="116" y="456" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Read posted-line dimensions</text>
<text x="116" y="480" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Global Dimension 1 -&gt; Cost Account Number / Name</text>
<text x="116" y="500" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Global Dimension 2 -&gt; Profit Center Code / Name</text>
<path d="M76 512 V532" stroke="#167d8d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="537" width="1020" height="82" rx="12" fill="white" stroke="#c9d7e6"/>
<circle cx="76" cy="577" r="20" fill="#167d8d"/>
<text x="76" y="583" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">5</text>
<text x="116" y="564" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#132b46">Interpret conditional and blank values</text>
<text x="116" y="588" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Payment Date requires settlement; PO details require the current order line.</text>
<text x="116" y="608" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Eight template columns are unmapped. See the guide for their names.</text>
<text x="40" y="710" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465b73">Illustration only | USD rates are required unless LCY is USD | Plant: DE = IVMK; MX = IVMP</text>
</svg>